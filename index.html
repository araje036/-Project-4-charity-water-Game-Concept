<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Drop Rescue</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand">
          <div class="brand-icon">💧</div>
          <div>
            <img src="title.png" alt="Water Drop Rescue" class="title-image" />
            <p>Help protect every drop.</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="label">Score</span>
            <span id="score">0</span>
          </div>
          <div class="stat-card">
            <span class="label">Time</span>
            <span id="timer">30</span>
          </div>
        </div>
      </header>

      <main class="content-grid">
        <section class="panel info-panel">
          <h2>Mission</h2>
          <p>
            Collect the bright blue water drops to earn points. Avoid the gray
            pollution drops to protect your score.
          </p>
          <div class="controls">
            <button id="startBtn">Start Game</button>
            <button id="restartBtn" class="secondary" hidden>Restart</button>
          </div>
          <div id="message" class="message">Tap start to begin your rescue mission.</div>
        </section>

        <section class="panel game-panel">
          <div id="gameBoard" class="game-board">
            <div id="bucket" class="bucket" aria-label="Bucket"></div>
            <div id="overlay" class="overlay">
              <img src="title.png" alt="Water Drop Rescue" class="overlay-title-image" />
              <div class="title-screen-asset">
                <img src="GoodWater.png" alt="Good water" class="title-screen-image" />
                <span class="title-screen-label">Good Water</span>
              </div>
              <p>Catch clean drops, avoid pollution, and learn more about charity: water.</p>
              <button id="overlayStartBtn">Start Game</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
